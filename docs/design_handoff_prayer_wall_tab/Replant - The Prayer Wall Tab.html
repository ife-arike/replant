<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replant — The Prayer Wall Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="prayer-wall-tab/styles.css">
</head>
<body>

  <div class="page-head">
    <div class="eyebrow">Replant · Prayer Wall · v2</div>
    <h1>A sanctuary, lit with many candles.</h1>
    <p>
      Same vocabulary as the Church tab. The intercession card primitive becomes the testimony card.
      Tweaks (bottom-right) switches between Default and No-testimonies states.
    </p>
  </div>

  <div class="frames-row">
    <div class="frame-stack">
      <div style="
        position: relative;
        width: 402px;
        height: 874px;
        border-radius: 56px;
        background: #050505;
        box-shadow:
          0 50px 120px rgba(0,0,0,0.55),
          0 0 0 1.5px rgba(240,237,230,0.05),
          inset 0 0 0 6px #0a0a0a,
          inset 0 0 0 8px rgba(240,237,230,0.05);
        overflow: hidden;
      ">
        <!-- Dynamic island -->
        <div style="position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 22px; z-index: 100;"></div>
        <div style="position: absolute; top: 22px; left: 30px; font-family: -apple-system, system-ui, sans-serif; font-weight: 590; font-size: 16px; color: #F0EDE6; z-index: 99;">9:41</div>
        <div style="position: absolute; top: 22px; right: 26px; z-index: 99; display: flex; gap: 6px; align-items: center; color: #F0EDE6;">
          <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.6" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="0.6" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.6" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="0.6" fill="currentColor"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><path d="M22.5 4v4c0.7-0.2 1.3-1 1.3-2c0-1-0.6-1.8-1.3-2z" fill="currentColor" fill-opacity="0.6"/></svg>
        </div>
        <div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: rgba(240,237,230,0.4); z-index: 100; pointer-events: none;"></div>

        <div id="root" style="position: absolute; inset: 0;"></div>
      </div>
      <div class="label">iPhone 16 Pro Max · Prayer Wall tab</div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
